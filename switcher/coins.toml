# Coins the switcher may mine. All use your Kryptex account login, so payouts stay in BTC
# whichever coin is active. Edit and `docker compose restart switcher` to apply.

[settings]
check_minutes = 30        # how often earnings are compared
switch_margin = 0.15      # another coin must earn at least 15% more...
confirm_checks = 2        # ...on this many checks in a row...
min_hours_on_coin = 6     # ...and the current coin must have run at least this long
min_volume_usd = 20000    # skip coins traded less than this per day (estimates unreliable)
pool_fee = 0.01           # Kryptex pool fee
pool_region = "us"        # Kryptex region: us, eu, br, sg, hk, ru, ae; "" = global endpoint
default_coin = ""         # coin to start on before the first comparison; "" = first coin below
pin = ""                  # set to a coin key (e.g. "PRL") to always mine that coin

# Per coin:
#   algorithm      SRBMiner algorithm name
#   pool           Kryptex endpoint; {region} is filled in from pool_region
#   dev_fee        SRBMiner's fee for that algorithm
#   whattomine_id  id in whattomine.com/coins.json (preferred data source)
#   hashrate_no    ticker on hashrate.no (fallback data source, volume, and benchmark hashrate)
#   benchmark_hs   optional: expected hashrate (H/s). Without it, hashrate.no's benchmark for
#                  GPU_MODEL (.env) is used until the miner has measured this GPU's own
#                  (kept in state/hashrates.json)
#   power_limit / core_clock / mem_clock   applied while mining this coin (clocks optional,
#                  and specific to the GPU they were tuned on)

[coins.PRL]
name = "Pearl"
algorithm = "pearlhash"
pool = "prl{region}.kryptex.network:7048"
dev_fee = 0.02
whattomine_id = 469
hashrate_no = "PRL"
power_limit = 250
core_clock = 1500            # tuned for an RTX 3080 Ti (2026-10-29): ~122 TH/s at ~200 W.
mem_clock = 810              # Re-tune or remove these two for a different GPU.

[coins.QTC]
name = "Quantus"
algorithm = "quantus"
pool = "qtc{region}.kryptex.network:7049"
dev_fee = 0.02
hashrate_no = "QUAN"         # not on WhatToMine (its "QTC" is Qubitcoin)
power_limit = 250

